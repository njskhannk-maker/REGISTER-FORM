
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>REGISTER</h1>

    <form action="" method="post">

        <label for="first-name">First Name</label>
        <input type="text" name="first-name" id="first-name" required>

        <label for="last-name">Last Name</label>
        <input type="text" name="last-name" id="last-name" required>

        <label for="petronymic">Petronymic</label>
        <input type="text" name="petronymic" id="petronymic">

        <label for="email">Email</label>
        <input type="email" name="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" required>

        <label for="age">Age</label>
        <input type="number" name="age" id="age" min="1" required>

        <label for="author-name">Author</label>

        <select name="author-name" id="author-name" required>
            <option value="">Select Author</option>
            <option value="Nusrat Jabeen">Nusrat Jabeen</option>
            <option value="Izmah Sheikh">Izmah Sheikh</option>
            <option value="Hiba Khan">Hiba Khan</option>
            <option value="Asma Khan">Asma Khan</option>
            <option value="Sana Khan">Sana Khan</option>
            <option value="Hina Khan">Hina Khan</option>
        </select>

        <textarea name="about" placeholder="A few words about you"></textarea>

        <button type="submit">Register</button>

    </form>

</body>
</html>
